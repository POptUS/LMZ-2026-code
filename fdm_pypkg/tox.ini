#
# Setup and manage python virtual environments that allow users to develop and
# test the fdm python package.
#

[tox]
requires = tox>=4
env_list =

[testenv]
description = Run the fdm full test suite
passenv = COVERAGE_FILE
setenv =
    COV_FILE = {env:COVERAGE_FILE:.coverage_fdm}
deps =
    coverage: coverage
usedevelop =
    coverage: true
    nocoverage: false
commands =
    nocoverage: python -m unittest fdm -v
    coverage: coverage run --rcfile={toxinidir}/.coveragerc --data-file={env:COV_FILE} -m unittest discover -s ./src/fdm -t .. -v

[testenv:oldest]
description = Run the fdm full test suite using the oldest dependencies
deps = -r{toxinidir}/oldest_reqs.txt
commands = python -m unittest fdm -v

[testenv:report]
description = Generate coverage reports
depends = coverage
deps = coverage
skip_install = true
commands =
    coverage report --data-file={env:COV_FILE}
    coverage html --data-file={env:COV_FILE}

[testenv:testdeploy]
description = Deploy distribution to TestPyPi for testing
deps = twine
commands =
    python setup.py sdist
    python setup.py bdist_wheel
    # This will prompt for username/password
    #
    # If dist was not empty beforehand, this could potentially upload many
    # different versions of distributions.
    twine upload --repository testpypi dist/*

[testenv:check]
# This should only *report* issues.  It should *not* alter any files.
description = Run code quality checks
deps =
    flake8
commands =
    python setup.py check --strict --metadata
    flake8 --config={toxinidir}/.flake8

[testenv:format]
# This can alter files, so users should use with care and this should never be
# a default task.
description = Clean-up code with black
deps = black
skip_install = true
commands = black {toxinidir}

